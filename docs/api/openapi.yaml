          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        account_type:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SocialAccountStatusEnum'
          readOnly: true
        is_mock:
          type: boolean
          readOnly: true
        is_usable:
          type: boolean
          readOnly: true
        scopes:
          readOnly: true
        token_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_error:
          type: string
          readOnly: true
        connected_by_email:
          type: string
          format: email
          readOnly: true
        connected_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_type
      - connected_at
      - connected_by_email
      - external_id
      - id
      - is_mock
      - is_usable
      - last_error
      - name
      - platform
      - scopes
      - status
      - token_expires_at
      - username
    SocialAccountStatusEnum:
      enum:
      - connected
      - needs_reauth
      - disconnected
      type: string
      description: |-
        * `connected` - Connected
        * `needs_reauth` - Reconnect required
        * `disconnected` - Disconnected
    Submit:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 500
    Target:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        format:
          $ref: '#/components/schemas/FormatEnum'
      required:
      - format
      - platform
    TargetAudience:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        age_range:
          type: string
          maxLength: 40
        locations:
          type: string
          maxLength: 200
        interests:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 15
        pain_points:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 15
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    UsageByWorkflow:
      type: object
      properties:
        operation:
          type: string
        requests:
          type: integer
        failed:
          type: integer
        estimated_cost_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
      required:
      - estimated_cost_usd
      - failed
      - operation
      - requests
    UsageSummary:
      type: object
      properties:
        period_start:
          type: string
          format: date-time
        ai_requests:
          type: integer
        ai_requests_limit:
          type: integer
        ai_estimated_cost_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,6})?$
        ai_cost_limit_usd:
          type: number
          format: double
        storage_bytes:
          type: integer
        storage_limit_bytes:
          type: integer
        publishes_last_24h:
          type: integer
        publishes_per_day_limit:
          type: integer
        ai_by_workflow:
          type: array
          items:
            $ref: '#/components/schemas/UsageByWorkflow'
        cost_is_estimate:
          type: boolean
      required:
      - ai_by_workflow
      - ai_cost_limit_usd
      - ai_estimated_cost_usd
      - ai_requests
      - ai_requests_limit
      - cost_is_estimate
      - period_start
      - publishes_last_24h
      - publishes_per_day_limit
      - storage_bytes
      - storage_limit_bytes
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        full_name:
          type: string
          maxLength: 150
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
    VersionFields:
      type: object
      description: Editable text fields of a content version (all optional; omitted
        = unchanged).
      properties:
        headline:
          type: string
          maxLength: 200
        hook:
          type: string
          maxLength: 300
        caption:
          type: string
          maxLength: 10000
        cta:
          type: string
          maxLength: 200
        hashtags:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 60
        script:
          type: string
          maxLength: 10000
        slides:
          type: array
          items:
            $ref: '#/components/schemas/Slide'
        creative_brief:
          type: string
          maxLength: 4000
        alt_text:
          type: string
          maxLength: 1000
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
