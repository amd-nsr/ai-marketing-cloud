components:
  schemas:
    AIOps:
      type: object
      properties:
        queued:
          type: integer
        running:
          type: integer
        succeeded_recent:
          type: integer
        failed_recent:
          type: integer
        recent_failures:
          type: array
          items:
            $ref: '#/components/schemas/RunFailure'
      required:
      - failed_recent
      - queued
      - recent_failures
      - running
      - succeeded_recent
    AIWorkflowRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        workflow:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AIWorkflowRunStatusEnum'
          readOnly: true
        result_type:
          type: string
          readOnly: true
        result_id:
          type: string
          readOnly: true
        output:
          readOnly: true
        provider:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        is_mock:
          type: boolean
          readOnly: true
        error_code:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - attempts
      - created_at
      - error_code
      - error_message
      - finished_at
      - id
      - is_mock
      - model
      - output
      - provider
      - result_id
      - result_type
      - started_at
      - status
      - workflow
    AIWorkflowRunStatusEnum:
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
      type: string
      description: |-
        * `queued` - Queued
        * `running` - Running
        * `succeeded` - Succeeded
        * `failed` - Failed
        * `cancelled` - Cancelled
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          maxLength: 64
      required:
      - token
    AccountAttention:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        status:
          type: string
      required:
      - id
      - name
      - platform
      - status
    Action:
