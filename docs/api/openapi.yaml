          - $ref: '#/components/schemas/AutomationActionStatusEnum'
          readOnly: true
        workflow:
          type: string
          readOnly: true
        initiated_by:
          type: string
          readOnly: true
        content_item:
          type: string
          format: uuid
          readOnly: true
          nullable: true
